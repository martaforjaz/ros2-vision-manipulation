<svg xmlns="http://www.w3.org/2000/svg" width="960" height="228" viewBox="0 0 960 228" font-family="Arial,sans-serif" role="img"><title>pipeline</title><rect width="960" height="228" fill="white"/><text x="28" y="49" fill="#102b59" font-size="30" font-weight="700">From an ArUco image to a simulated pick and place</text><rect x="28" y="85" width="210" height="45" rx="22" fill="#102b59"/><text x="42" y="114" fill="#fff" font-size="19" font-weight="700">I. Publish image</text><text x="32" y="164" fill="#102b59" font-size="16" font-weight="700">Synthetic camera</text><text x="32" y="192" fill="#506078" font-size="15" font-weight="400">ROS 2 sensor_msgs/Image</text><text x="239" y="166" fill="#915883" font-size="22" font-weight="700">→</text><rect x="262" y="85" width="210" height="45" rx="22" fill="#102b59"/><text x="276" y="114" fill="#fff" font-size="19" font-weight="700">II. Estimate pose</text><text x="266" y="164" fill="#102b59" font-size="16" font-weight="700">OpenCV ArUco + PnP</text><text x="266" y="192" fill="#506078" font-size="15" font-weight="400">Reject missing markers</text><text x="473" y="166" fill="#915883" font-size="22" font-weight="700">→</text><rect x="496" y="85" width="210" height="45" rx="22" fill="#102b59"/><text x="510" y="114" fill="#fff" font-size="19" font-weight="700">III. Plan motion</text><text x="500" y="164" fill="#102b59" font-size="16" font-weight="700">Camera-to-arm transform</text><text x="500" y="192" fill="#506078" font-size="15" font-weight="400">Reject unreachable targets</text><text x="707" y="166" fill="#915883" font-size="22" font-weight="700">→</text><rect x="730" y="85" width="210" height="45" rx="22" fill="#102b59"/><text x="744" y="114" fill="#fff" font-size="19" font-weight="700">IV. Execute</text><text x="734" y="164" fill="#102b59" font-size="16" font-weight="700">MuJoCo arm dynamics</text><text x="734" y="192" fill="#506078" font-size="15" font-weight="400">ROS 2 result topic</text></svg>
